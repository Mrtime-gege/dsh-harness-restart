# dsh-harness-restart —— 在 profile 根上插入一行插件。
#
# v1 引擎配置键（全部可选；也可以在 WebUI 设置页「DSH 重启」中修改，
# 或写入 $DSH_HOME/dsh-harness-restart-v1.json 覆盖，优先级最高）。
# 越界值会直接报错（绝不静默钳制）；损坏的覆盖文件会回退默认并给出 warnings，不会阻止启动。

- insert:
    - id: harness-restart
      name: 'dsh-harness-restart'
      config:
        # AI 权限（对 dsh_restart 工具生效；页面按钮不受影响）
        ai:
          restartEnabled: true          # 是否允许 AI 发起重启
          challengeEnabled: true        # AI 发起需两段式挑战（16 位 token 二次确认）
          allowNow: false               # 是否允许 AI 用 now 立即重启（默认关）
          delayRangeMs: [180000, 3600000]  # AI 的 delay 区间（3 分钟~1 小时）
          recommendDelayMs: 300000      # 越界时的推荐值（5 分钟）
        # 定时回调（官方预设或自定义脚本；命中后走 审批→PRE→EXIT→POST 全流程）
        # schedule:
        #   - { id: daily-2am, kind: preset, preset: daily, args: { hour: 2, minute: 0 } }
        #   - { id: my-script, kind: script, script: 'return hour === 3 && minute === 30' }
        # 重启前（PRE）
        preRestart:
          mode: waitAllOrForce          # immediate | waitSeconds | waitAllOrForce
          forceAfterMs: 30000           # waitAllOrForce 超时强断（ms；-1=无限等）；waitSeconds 以秒计的等待
        # 重启后（POST）
        postRestart:
          mode: resumeAll               # none | resumeRequester | resumeAll
        restartDelayMs: 2000            # EXIT 前缓冲（ms）
        # 方案 B：恢复回调渐进式（等 1 分钟 → 每 5 秒唤醒一个会话）
        bootRestoreDelayMs: 60000
        restoreStaggerMs: 5000
        callbackUnackTimeoutMs: 1800000 # 回执超时（30 分钟），超时提醒一次
        # 演练模式：finalize 不真重启（不 exit/不拉起），事件链与恢复照常走。
        # 也可用环境变量 DSH_RESTART_SIMULATE=1 等价开启（测试用，勿在生产误开）。
        simulateOnly: false
        # 提示文案（占位符 {minutes} / {cbId} / {description}）
        notifyPrompt: '【DSH 重启】DSH 将在约 {minutes} 分钟后重启。请尽快收尾当前工作、不要发起新的长任务；重启后未完成的工作会自动继续。'
        continuePrompt: '【DSH 重启】已重启完成。请检查本会话是否有未完成的工作或活动中的 goal：如有，先恢复/继续它，完成后再向用户简要报告恢复结果。'
        restorePrompt: '【DSH 重启】已重启。你注册的回调 {cbId}（{description}）已恢复，自动继续之前的任务。'
        logTailLines: 300