# Publish a new npm release automatically when a tag `v0.1.x` is pushed.
#
# npm 自动发布两种任选其一：
#   A) 经典 token：到 npmjs.com → Access Tokens 建一个 Automation token，
#      再加到本仓库 Secrets 名为 NPM_TOKEN。
#   B) OIDC trusted publishing（更安全）：npmjs.com → 你的包 → Settings →
#      Access → 添加 publisher（指向本仓库与 release 分支）；并把下面
#      步骤的 NODE_AUTH_TOKEN 换成 `npm publish --provenance --access public`。
#
# 注意：只发布插件本体（package.json 的 files 白名单决定 tarball 内容）。

name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}